name: Pavra Android APK Release

on:
  push:
    tags:
      - "pavra-v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump before building (none builds current version in packages/app/src/pavra/version.json)"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - patch
          - minor
          - major

concurrency:
  group: pavra-apk-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  build-and-release-apk:
    name: Build & Publish Pavra ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21 & Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi

      - name: Optional version bump (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bump != 'none' && inputs.bump != '' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/pavra/bump-version.mjs --mode "${{ inputs.bump }}" --commit-and-tag --push

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build Pavra ARM64 release APK
        run: npm run pavra:apk:arm64

      - name: Publish APK, update.json, and SHA256SUMS to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAVRA_GITHUB_REPO: ${{ github.repository }}
          PAVRA_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/pavra-v') && github.ref_name || '' }}
        run: node scripts/pavra/release-apk.mjs --skip-build
